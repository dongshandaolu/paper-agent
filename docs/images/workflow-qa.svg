<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="700" height="280" fill="#f8fafc"/>
