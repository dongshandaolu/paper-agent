<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="900" height="360" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">端到端数据流</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="30" y="55" width="120" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="90" y="85" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600">PDF 文件</text>
  <path d="M150 80 L190 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="192" y="55" width="130" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="257" y="85" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="600">PyMuPDF 解析</text>
  <path d="M322 80 L362 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="364" y="55" width="150" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="439" y="85" text-anchor="middle" fill="#3730a3" font-size="11" font-weight="600">PaperDocument</text>
  <path d="M514 80 L554 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="556" y="55" width="140" height="50" rx="6" fill="#d1fae5" stroke="#10b981"/><text x="626" y="85" text-anchor="middle" fill="#065f46" font-size="11" font-weight="600">检索索引</text>
  <path d="M696 80 L736 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="738" y="55" width="130" height="50" rx="6" fill="#ccfbf1" stroke="#0d9488"/><text x="803" y="85" text-anchor="middle" fill="#115e59" font-size="11" font-weight="600">PaperRegistry</text>
  <path d="M439 105 L439 140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="142" width="280" height="40" rx="6" fill="#7c3aed"/><text x="440" y="168" text-anchor="middle" fill="white" font-size="12" font-weight="600">LangGraph 工作流 (PaperState)</text>
  <rect x="120" y="220" width="160" height="45" rx="6" fill="#fce7f3" stroke="#ec4899"/><text x="200" y="248" text-anchor="middle" fill="#9d174d" font-size="10" font-weight="600">结构化输出</text>
  <rect x="370" y="220" width="160" height="45" rx="6" fill="#ffedd5" stroke="#ea580c"/><text x="450" y="248" text-anchor="middle" fill="#9a3412" font-size="10" font-weight="600">Pydantic 模型</text>
  <rect x="620" y="220" width="160" height="45" rx="6" fill="#e2e8f0" stroke="#475569"/><text x="700" y="248" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="600">Markdown 报告</text>
  <path d="M440 182 L200 220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440 182 L450 220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440 182 L700 220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M700 265 L700 295" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="610" y="297" width="180" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="700" y="322" text-anchor="middle" fill="#334155" font-size="11" font-weight="600">output/*.md</text>
