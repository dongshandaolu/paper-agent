<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Paper Agent - 系统分层架构</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="40" y="55" width="820" height="70" rx="8" fill="#2563eb"/>
  <text x="450" y="82" text-anchor="middle" fill="white" font-size="14" font-weight="600">入口层 (Entry)</text>
  <text x="260" y="110" text-anchor="middle" fill="white" font-size="12">CLI - Typer + Rich</text>
  <text x="640" y="110" text-anchor="middle" fill="white" font-size="12">MCP Server - FastMCP (stdio)</text>
  <path d="M450 125 L450 145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="150" width="820" height="70" rx="8" fill="#0d9488"/>
  <text x="450" y="177" text-anchor="middle" fill="white" font-size="14" font-weight="600">服务层 (PaperService + PaperRegistry)</text>
  <text x="450" y="200" text-anchor="middle" fill="#ccfbf1" font-size="11">upload / ask / read_full / compare / structure / questions / terms</text>
  <path d="M450 220 L450 240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="245" width="820" height="70" rx="8" fill="#7c3aed"/>
  <text x="450" y="272" text-anchor="middle" fill="white" font-size="14" font-weight="600">编排层 (LangGraph StateGraph)</text>
  <text x="450" y="295" text-anchor="middle" fill="#ede9fe" font-size="11">read / full_read / qa / compare / unified (5 种工作流)</text>
  <path d="M450 315 L450 335" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="340" width="820" height="70" rx="8" fill="#ea580c"/>
  <text x="450" y="367" text-anchor="middle" fill="white" font-size="14" font-weight="600">Agent 层 (Specialist Agents)</text>
  <text x="450" y="390" text-anchor="middle" fill="#ffedd5" font-size="10">Parser / Structure / Research / Terms / Analyst / Critic / QA / Reflection / Comparer / Writer</text>
  <path d="M450 410 L450 430" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="435" width="400" height="60" rx="8" fill="#ca8a04"/>
  <text x="240" y="462" text-anchor="middle" fill="white" font-size="13" font-weight="600">工具层 (Tools)</text>
  <text x="240" y="480" text-anchor="middle" fill="#fef9c3" font-size="10">PDF Parser / Chunker / Hybrid Retriever / RCS</text>
  <rect x="460" y="435" width="400" height="60" rx="8" fill="#475569"/>
  <text x="660" y="462" text-anchor="middle" fill="white" font-size="13" font-weight="600">模型层 (Models)</text>
  <text x="660" y="480" text-anchor="middle" fill="#e2e8f0" font-size="10">LLM (OpenAI 兼容) / TF-IDF / Chroma / FastEmbed</text>
</svg>
