[project]
name = "paper-agent"
version = "0.1.0"
description = "Multi-agent professional paper reading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "jinja2>=3",
    "python-dotenv>=1.0",
    "mcp>=1.2",
    "fastembed>=0.4",
    "scikit-learn>=1.3",
]

[project.scripts]
paper-agent = "paper_agent.main:app"
paper-agent-mcp = "paper_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_agent"]
